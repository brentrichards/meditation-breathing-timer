<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#102b2a" />
    <title>Meditation Breathing Timer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Breathing Timer</h1>
        <nav class="views" aria-label="Visualization">
          <button data-view="circle" aria-pressed="true">Circle</button>
          <button data-view="wave" aria-pressed="false">Wave</button>
          <button data-view="petal" aria-pressed="false">Petal</button>
          <button data-view="dashboard" aria-pressed="false">Dashboard</button>
        </nav>
        <button
          id="settings-open"
          class="icon-button"
          aria-label="Settings"
          title="Settings"
          aria-expanded="false"
          aria-controls="settings"
        >
          <img src="icons/sliders-horizontal.svg" alt="" />
        </button>
      </header>
      <section class="practice" aria-label="Breathing session">
        <div class="phase">
          <span id="phase-label">Ready</span
          ><span id="breath-timer" hidden>5</span>
        </div>
        <div class="visual-area">
          <canvas id="visual" aria-label="Breathing visualization"></canvas>
          <div id="dashboard" hidden>
            <div>
              <span>Current phase</span><strong id="dash-phase">Ready</strong>
            </div>
            <div>
              <span>Cycle length</span><strong id="cycle-length">10.0s</strong>
            </div>
            <div>
              <span>Session left</span
              ><strong id="dash-session">Continuous</strong>
            </div>
            <div><span>Breaths</span><strong id="breath-count">0</strong></div>
          </div>
        </div>
        <footer>
          <div id="session-readout" class="session-readout">
            <span>Session</span><strong id="session-time">Continuous</strong
            ><span class="elapsed" id="elapsed">0:00 elapsed</span>
          </div>
          <div class="transport">
            <button id="start-stop" class="primary">Start</button>
            <button
              id="reset"
              class="icon-button"
              aria-label="Reset session"
              title="Reset session"
            >
              <img src="icons/rotate-ccw.svg" alt="" />
            </button>
          </div>
        </footer>
        <p id="notice" role="status"></p>
      </section>
    </main>
    <div id="scrim" hidden></div>
    <aside
      id="settings"
      class="drawer"
      aria-label="Settings"
      inert
      aria-hidden="true"
    >
      <div class="drawer-heading">
        <h2>Settings</h2>
        <button
          id="settings-close"
          class="icon-button"
          aria-label="Close settings"
          title="Close settings"
        >
          <img src="icons/x.svg" alt="" />
        </button>
      </div>
      <section>
        <h3>Breath</h3>
        <label class="slider"
          ><span>In</span
          ><input
            id="inhale"
            type="range"
            min="3"
            max="7"
            step="0.1"
            value="5"
          /><output id="inhale-value">5.0s</output></label
        >
        <label class="slider"
          ><span>Hold</span
          ><input
            id="pause"
            type="range"
            min="0"
            max="2"
            step="0.1"
            value="0"
          /><output id="pause-value">0.0s</output></label
        >
        <label class="slider"
          ><span>Out</span
          ><input
            id="exhale"
            type="range"
            min="3"
            max="7"
            step="0.1"
            value="5"
          /><output id="exhale-value">5.0s</output></label
        >
      </section>
      <section>
        <h3>Session</h3>
        <div class="presets" aria-label="Session presets">
          <button data-session="continuous" aria-pressed="true">
            Continuous</button
          ><button data-session="5" aria-pressed="false">5 min</button
          ><button data-session="10" aria-pressed="false">10 min</button
          ><button data-session="20" aria-pressed="false">20 min</button>
        </div>
        <label class="slider"
          ><span>Minutes</span
          ><input
            id="session-minutes"
            type="range"
            min="3"
            max="40"
            step="1"
            value="10"
          /><output id="minutes-value">10 min</output></label
        >
      </section>
      <section>
        <h3>Appearance</h3>
        <label
          >Colour
          <div class="swatches" role="group" aria-label="Colour palette">
            <button
              data-palette="sea"
              aria-label="Green and gold"
              title="Green and gold"
              aria-pressed="true"
            ></button
            ><button
              data-palette="rose"
              aria-label="Red"
              title="Red"
              aria-pressed="false"
            ></button
            ><button
              data-palette="blue"
              aria-label="Blue"
              title="Blue"
              aria-pressed="false"
            ></button></div
        ></label>
        <label class="select-row"
          >Background<select id="theme">
            <option value="light">Light</option>
            <option value="dim">Dim</option>
          </select></label
        >
        <label class="check"
          ><input id="reduced-motion" type="checkbox" />Reduced motion</label
        >
        <label class="check"
          ><input id="show-timer" type="checkbox" />Show breath countdown</label
        >
        <label class="select-row"
          >Countdown step<select id="timer-step">
            <option value="0.1">0.1 second</option>
            <option value="0.2">0.2 second</option>
            <option value="0.5">0.5 second</option>
            <option value="1" selected>1 second</option>
          </select></label
        >
        <label class="check"
          ><input id="show-session" type="checkbox" checked />Show session
          time</label
        >
      </section>
      <section>
        <h3>Sound</h3>
        <div class="sound-row">
          <label for="inhale-sound">In sound</label
          ><select id="inhale-sound"></select
          ><button
            class="preview icon-button"
            data-preview="inhale"
            aria-label="Preview inhale sound"
            title="Preview inhale sound"
          >
            <img src="icons/play.svg" alt="" />
          </button>
        </div>
        <div class="sound-row">
          <label for="pause-sound">Hold sound</label
          ><select id="pause-sound"></select
          ><button
            class="preview icon-button"
            data-preview="pause"
            aria-label="Preview hold sound"
            title="Preview hold sound"
          >
            <img src="icons/play.svg" alt="" />
          </button>
        </div>
        <div class="sound-row">
          <label for="exhale-sound">Out sound</label
          ><select id="exhale-sound"></select
          ><button
            class="preview icon-button"
            data-preview="exhale"
            aria-label="Preview exhale sound"
            title="Preview exhale sound"
          >
            <img src="icons/play.svg" alt="" />
          </button>
        </div>
        <label class="select-row"
          >Playback<select id="playback">
            <option value="sustained">Throughout each breath</option>
            <option value="cue">Short phase cues</option>
          </select></label
        >
        <label class="select-row"
          >Shape<select id="shape">
            <option value="fade-out">Louder to quieter</option>
            <option value="swell">Soft to loud to soft</option>
            <option value="constant">Constant</option>
          </select></label
        >
        <label class="slider"
          ><span>Volume</span
          ><input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.45"
          /><output id="volume-value">45%</output></label
        >
        <a
          class="credits"
          href="AUDIO-CREDITS.md"
          target="_blank"
          rel="noopener"
          >Audio credits</a
        >
      </section>
    </aside>
    <script src="audio/samples.js"></script>
    <script src="app.js"></script>
  </body>
</html>
